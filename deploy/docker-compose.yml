# Local dev stack: Postgres + Redis + Go API + Next.js web.
# Usage: docker compose -f deploy/docker-compose.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_travel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      API_PORT: "8080"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ai_travel?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-insecure-change-me
      JWT_TTL_HOURS: "72"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
